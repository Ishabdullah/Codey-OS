[pytest]
# WP1.1 (CODEY_OS_MASTER_BLUEPRINT.md §20.1/§21). bench/tasks/*/hidden/ holds
# the frozen benchmark's per-task fixture modules -- each imports a
# same-named local module (fb.py, kv.py, stack.py, ...) that only exists
# once a candidate solution is copied beside it at run time. Collected from
# the repo root they all fail with ModuleNotFoundError; they are not part
# of the Codey-OS test suite proper, bench/runner.py drives them directly
# with the right cwd/sys.path. This is the one correctness-neutral way to
# keep CI from going red for a reason that isn't a code regression.
norecursedirs = bench/tasks .git node_modules
