name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # Proxy vars are also cleared by root conftest.py (NEW-756) -- unset
        # here too so a runner-level proxy can't reintroduce the artifact
        # before conftest.py's module body executes.
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY \
                http_proxy https_proxy all_proxy no_proxy
          pytest -q -rA
